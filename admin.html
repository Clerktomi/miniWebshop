<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webshop - Admin oldal</title>
    <link rel="icon" type="image" href="pictures/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    
    <div class="container">
        <div class="row">
            <h2 class="text-center">GamerShop.hu / ADMIN</h2>
        </div>
        <div class="row d-flex align-items-center justify-content-center">
            <div class="col-6">
                <form id="hozzaad">
                    <input type="text" class="form-control my-3" placeholder="Termék neve:" id="nev" required>
                    <input type="number" class="form-control my-3" placeholder="Termék ára:" id="ar" required>
                    <input type="text" class="form-control my-3" placeholder="Termék leírása:" id="leiras" required>
                    <button class="btn btn-success" id="" type="submit">Hozzáad </button>
                </form>
            </div>
        </div>
        <div class="row d-flex align-items-center justify-content-center">
            <div class="col-6 my-3" id="TermekModosit" style="display:  none;">
                <h4>Termék módosítása</h4>
                <form id="modositkuld">
                    <hr>
                    <input type="text" class="form-control my-3" placeholder="Termék új neve:" id="Ujnev" required>
                    <input type="number" class="form-control my-3" placeholder="Termék új ára:" id="Ujar" required>
                    <input type="text" class="form-control my-3" placeholder="Termék új leírása:" id="Ujleiras" required>
                    <button class="btn btn-warning" id="modositGomb" type="submit">Módósít</button>
                </form>
            </div>
        </div>
        <div class="row my-4">
            <h4>Elérhető Termékek</h4>
            <div class="row" id="elerhetoTermekek" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Név</th>
                            <th>Ár</th>
                            <th>Leírás</th>
                            <th>Kezelés</th>
                        </tr>
                    </thead>
                    <tbody id="adminTermekek">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
